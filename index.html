<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЦЕНТР ЗРЕНИЯ | Европейская офтальмология</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1e1e2f;
            line-height: 1.5;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            color: #1e1e2f;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Glass & Shadows */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 32, 64, 0.15);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            outline: none;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: #1e1e2f;
            color: white;
            box-shadow: 0 8px 20px -6px rgba(30, 30, 47, 0.3);
        }

        .btn-primary:hover {
            background: #2b2b45;
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -8px rgba(30, 30, 47, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(30, 30, 47, 0.2);
            color: #1e1e2f;
            backdrop-filter: blur(4px);
        }

        .btn-outline:hover {
            border-color: #1e1e2f;
            background: rgba(30, 30, 47, 0.02);
            transform: translateY(-2px);
        }

        /* Header */
        header {
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(174, 200, 220, 0.2);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1e1e2f;
            text-decoration: none;
        }

        .logo span {
            color: #6b9abf; /* медицинский голубой */
            font-weight: 300;
        }

        .nav-menu {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu a {
            text-decoration: none;
            color: #1e1e2f;
            font-weight: 500;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .nav-menu a:hover {
